name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===== لينكس (glibc) - المرحلة السريعة: باينري ELF فقط، بدون تغليف =====
  build-linux-elf:
    name: Build Linux ELF (glibc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config patchelf upx-ucl libfontconfig1-dev \
            qt6-base-dev qt6-declarative-dev libqt6svg6-dev \
            libqt6core6 libqt6gui6 libqt6widgets6 libqt6qml6 libqt6quick6 libqt6quickcontrols2-6 libqt6svg6 \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window

      - name: Build Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(nproc)

      - name: Stage shared libraries from build tree
        run: |
          mkdir -p staging
          cp build/openlibrary staging/
          find build/ -name "*.so*" -exec cp -a {} staging/ \; || true
          echo "=== Staged files ==="
          ls -la staging/

      - name: Prepare package-ready binary (RPATH = /usr/lib/openlibrary)
        run: |
          mkdir -p pkg-staging
          cp -a staging/* pkg-staging/
          patchelf --set-rpath '/usr/lib/openlibrary' pkg-staging/openlibrary

      - name: Compress standalone ELF Binary
        run: |
          cp build/openlibrary openlibrary-elf-glibc
          upx --best --lzma openlibrary-elf-glibc || true

      - name: Upload Linux ELF Binary
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-ELF
          path: openlibrary-elf-glibc

      - name: Upload package-ready build outputs
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-PkgBuild
          path: pkg-staging/

  # ===== لينكس (glibc) - تغليف .deb و .rpm =====
  build-linux-packages:
    name: Build Linux Packages (.deb / .rpm)
    needs: build-linux-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Linux-PkgBuild
          path: build-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp build-src/openlibrary openlibrary-bin
          chmod +x openlibrary-bin

      # بناء حزمة .deb
      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/openlibrary_1.25_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/lib/openlibrary"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          mkdir -p "${PKG_ROOT}/usr/share/icons/hicolor/256x256/apps"

          cp openlibrary-bin "${PKG_ROOT}/usr/bin/openlibrary"
          find build-src/ -name "*.so*" -exec cp -a {} "${PKG_ROOT}/usr/lib/openlibrary/" \; || true
          cp openlibrary.desktop "${PKG_ROOT}/usr/share/applications/"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: openlibrary
          Version: 1.25
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: OpenLibrary - Open source epub reader
           قارئ كتب إلكترونية مفتوح المصدر
          Section: utils
          Priority: optional
          EOF

          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb OpenLibrary-Linux.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-deb
          path: OpenLibrary-Linux.deb

      # بناء حزمة .rpm
      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}

          mkdir -p rpmbuild/SOURCES/openlibrary-1.25
          cp openlibrary-bin rpmbuild/SOURCES/openlibrary-1.25/openlibrary
          find build-src/ -name "*.so*" -exec cp -a {} rpmbuild/SOURCES/openlibrary-1.25/ \; || true
          cp openlibrary.desktop rpmbuild/SOURCES/openlibrary-1.25/
          tar -czf rpmbuild/SOURCES/openlibrary-1.25.tar.gz -C rpmbuild/SOURCES openlibrary-1.25

          cat > rpmbuild/SPECS/openlibrary.spec <<'SPEC'
          %global debug_package %{nil}
          %global __strip /bin/true

          Name:           openlibrary
          Version:        1.25
          Release:        1%{?dist}
          Summary:        Open source epub reader
          License:        GPL
          Source0:        openlibrary-1.25.tar.gz

          %description
          OpenLibrary - قارئ كتب إلكترونية مفتوح المصدر

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/lib/openlibrary
          mkdir -p %{buildroot}/usr/share/applications
          cp openlibrary %{buildroot}/usr/bin/
          cp -a *.so* %{buildroot}/usr/lib/openlibrary/ || true
          cp openlibrary.desktop %{buildroot}/usr/share/applications/

          %files
          /usr/bin/openlibrary
          /usr/lib/openlibrary
          /usr/share/applications/openlibrary.desktop
          SPEC

          sed -i 's/^          //' rpmbuild/SPECS/openlibrary.spec

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/openlibrary.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} OpenLibrary-Linux.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-rpm
          path: OpenLibrary-Linux.rpm

  # ===== Alpine (musl) - المرحلة السريعة =====
  build-alpine-elf:
    name: Build Alpine ELF (musl libc)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          apk update
          apk add --no-cache build-base cmake pkgconf patchelf upx fontconfig-dev git ninja \
            qt6-qtbase-dev qt6-qtdeclarative-dev qt6-qtsvg-dev

      - name: Build Project
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Stage shared libraries from build tree
        run: |
          mkdir -p staging
          cp build/openlibrary staging/
          find build/ -name "*.so*" -exec cp -a {} staging/ \; || true
          echo "=== Staged files ==="
          ls -la staging/

      - name: Create Portable Archive (patchelf + $ORIGIN)
        run: |
          mkdir -p portable/OpenLibrary
          cp -a staging/* portable/OpenLibrary/
          patchelf --set-rpath '$ORIGIN' portable/OpenLibrary/openlibrary
          tar czf OpenLibrary-Linux-musl-Portable.tar.gz -C portable OpenLibrary

      - name: Prepare package-ready binary (RPATH = /usr/lib/openlibrary)
        run: |
          mkdir -p pkg-staging
          cp -a staging/* pkg-staging/
          patchelf --set-rpath '/usr/lib/openlibrary' pkg-staging/openlibrary

      - name: Compress standalone musl ELF Binary
        run: |
          cp build/openlibrary openlibrary-elf-musllibc
          upx --best --lzma openlibrary-elf-musllibc || true

      - name: Upload Alpine Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-ELF-musl
          path: openlibrary-elf-musllibc

      - name: Upload musl Portable Archive
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-Portable
          path: OpenLibrary-Linux-musl-Portable.tar.gz

      - name: Upload musl package-ready build outputs
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-PkgBuild
          path: pkg-staging/

  # ===== تغليف .deb و .rpm نسخة musl =====
  build-linux-packages-musl:
    name: Build Linux Packages (.deb / .rpm — musl)
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-PkgBuild
          path: build-src

      - name: Install Packaging Dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Prepare Binary for Packaging
        run: |
          cp build-src/openlibrary openlibrary-bin
          chmod +x openlibrary-bin

      - name: Build .deb Package
        run: |
          PKG_ROOT="deb-build/openlibrary_1.25_amd64"
          mkdir -p "${PKG_ROOT}/DEBIAN"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/lib/openlibrary"
          mkdir -p "${PKG_ROOT}/usr/share/applications"

          cp openlibrary-bin "${PKG_ROOT}/usr/bin/openlibrary"
          find build-src/ -name "*.so*" -exec cp -a {} "${PKG_ROOT}/usr/lib/openlibrary/" \; || true
          cp openlibrary.desktop "${PKG_ROOT}/usr/share/applications/"

          cat > "${PKG_ROOT}/DEBIAN/control" <<EOF
          Package: openlibrary
          Version: 1.25
          Architecture: amd64
          Maintainer: ahmed-x86
          Description: OpenLibrary - Open source epub reader (musl build)
           قارئ كتب إلكترونية مفتوح المصدر
          Section: utils
          Priority: optional
          EOF

          sed -i 's/^          //' "${PKG_ROOT}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG_ROOT}"
          mv deb-build/*.deb OpenLibrary-Linux-musl.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-deb
          path: OpenLibrary-Linux-musl.deb

      - name: Build .rpm Package
        run: |
          mkdir -p rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
          mkdir -p rpmbuild/SOURCES/openlibrary-1.25
          cp openlibrary-bin rpmbuild/SOURCES/openlibrary-1.25/openlibrary
          find build-src/ -name "*.so*" -exec cp -a {} rpmbuild/SOURCES/openlibrary-1.25/ \; || true
          cp openlibrary.desktop rpmbuild/SOURCES/openlibrary-1.25/
          tar -czf rpmbuild/SOURCES/openlibrary-1.25.tar.gz -C rpmbuild/SOURCES openlibrary-1.25

          cat > rpmbuild/SPECS/openlibrary.spec <<'SPEC'
          %global debug_package %{nil}
          %global __strip /bin/true

          Name:           openlibrary
          Version:        1.25
          Release:        1%{?dist}
          Summary:        Open source epub reader (musl build)
          License:        GPL
          Source0:        openlibrary-1.25.tar.gz

          %description
          OpenLibrary - قارئ كتب إلكترونية مفتوح المصدر

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/lib/openlibrary
          mkdir -p %{buildroot}/usr/share/applications
          cp openlibrary %{buildroot}/usr/bin/
          cp -a *.so* %{buildroot}/usr/lib/openlibrary/ || true
          cp openlibrary.desktop %{buildroot}/usr/share/applications/

          %files
          /usr/bin/openlibrary
          /usr/lib/openlibrary
          /usr/share/applications/openlibrary.desktop
          SPEC

          sed -i 's/^          //' rpmbuild/SPECS/openlibrary.spec
          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/openlibrary.spec
          find rpmbuild/RPMS -name "*.rpm" -exec cp {} OpenLibrary-Linux-musl.rpm \;

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-rpm
          path: OpenLibrary-Linux-musl.rpm

  # ===== Alpine (musl) - تغليف حزمة .apk رسمية بأداة abuild =====
  build-alpine-apk:
    name: Build Alpine .apk Package
    needs: build-alpine-elf
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download musl Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-PkgBuild
          path: build-src

      - name: Install abuild Tooling
        run: |
          apk update
          apk add --no-cache alpine-sdk sudo

      - name: Create Non-root Build User
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate abuild Signing Key
        run: su builder -c "abuild-keygen -a -i -n"

      - name: Prepare APKBUILD Sources
        run: |
          mkdir -p apk-pkg

          mkdir -p apk-src/openlibrary-1.25
          cp build-src/openlibrary apk-src/openlibrary-1.25/
          find build-src/ -name "*.so*" -exec cp -a {} apk-src/openlibrary-1.25/ \; || true
          cp openlibrary.desktop apk-src/openlibrary-1.25/
          tar czf apk-pkg/openlibrary-1.25.tar.gz -C apk-src openlibrary-1.25

          cat > apk-pkg/APKBUILD <<'EOF'
          pkgname=openlibrary
          pkgver=1.25
          pkgrel=0
          pkgdesc="Open source epub reader - قارئ كتب إلكترونية مفتوح المصدر"
          url="https://github.com/ahmed-x86/openlibrary"
          arch="x86_64"
          license="GPL"
          depends="fontconfig qt6-qtbase qt6-qtdeclarative qt6-qtsvg"
          makedepends="qt6-qtbase-dev qt6-qtdeclarative-dev qt6-qtsvg-dev"
          options="!strip !check"
          source="openlibrary-$pkgver.tar.gz"

          package() {
              install -Dm755 "$srcdir"/openlibrary-$pkgver/openlibrary "$pkgdir"/usr/bin/openlibrary
              install -d "$pkgdir"/usr/lib/openlibrary
              for lib in "$srcdir"/openlibrary-$pkgver/*.so*; do
                  [ -e "$lib" ] && install -Dm755 "$lib" "$pkgdir"/usr/lib/openlibrary/"$(basename "$lib")"
              done
              install -Dm644 "$srcdir"/openlibrary-$pkgver/openlibrary.desktop "$pkgdir"/usr/share/applications/openlibrary.desktop
          }
          EOF
          sed -i 's/^          //' apk-pkg/APKBUILD

      - name: Build .apk Package with abuild
        run: |
          chmod +x build-src/openlibrary
          chown -R builder:builder apk-pkg
          cd apk-pkg
          su builder -c "cd $(pwd) && abuild checksum && abuild -r"
          find ~builder/packages -name "*.apk" -exec cp {} ../OpenLibrary-Alpine.apk \;

      - name: Upload Alpine .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Alpine-apk
          path: OpenLibrary-Alpine.apk

  # ===== Arch Linux - المرحلة 1: باينري فقط (بدون تغليف) يُبنى داخل حاوية Arch =====
  build-arch-elf:
    name: Build Arch ELF (native, no packaging)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja pkgconf \
            qt6-base qt6-declarative qt6-svg libzip pugixml fontconfig

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Project
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Stage files
        run: |
          DESTDIR="$PWD/arch-root" cmake --install build
          strip --strip-unneeded arch-root/usr/bin/openlibrary || true
          cp arch-root/usr/bin/openlibrary openlibrary-elf-arch
          ls -la openlibrary-elf-arch

      - name: Upload Arch ELF (يُنشر في الإصدار)
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Arch-ELF
          path: openlibrary-elf-arch

      - name: Upload install tree (للمرحلة 2 فقط، لا يُنشر)
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Arch-PkgBuild
          path: arch-root/

  # ===== Arch Linux - المرحلة 2: تغليف الباينري الجاهز فقط (لا إعادة بناء) =====
  build-arch:
    name: Package Arch (.pkg.tar.zst) from the ELF
    needs: build-arch-elf
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Arch install tree
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Arch-PkgBuild
          path: arch-root

      - name: Create Non-root Build User
        run: |
          pacman -Syu --noconfirm --needed sudo
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Write PKGBUILD
        run: |
          VER="$(grep -oP 'project\(OpenLibrary VERSION \K[0-9.]+' CMakeLists.txt)"
          mkdir -p arch-pkg
          cat > arch-pkg/PKGBUILD <<EOF
          pkgname=openlibrary
          pkgver=${VER}
          pkgrel=1
          pkgdesc="Open source epub reader"
          arch=('x86_64')
          url="https://github.com/ahmed-x86/openlibrary"
          license=('GPL')
          depends=('fontconfig' 'qt6-base' 'qt6-declarative' 'qt6-svg' 'libzip' 'pugixml' 'shared-mime-info' 'desktop-file-utils')
          options=('!debug' '!strip' '!lto')

          package() {
              cp -a "\$SRCROOT/arch-root/." "\$pkgdir/"
              chmod 755 "\$pkgdir/usr/bin/openlibrary"
          }
          EOF
          cat arch-pkg/PKGBUILD

      - name: Build Package with makepkg (no compile)
        run: |
          chown -R builder:builder arch-pkg arch-root
          cd arch-pkg
          su builder -c "SRCROOT='$GITHUB_WORKSPACE' makepkg -d --noconfirm"
          mv openlibrary-*-x86_64.pkg.tar.zst ../OpenLibrary-Linux.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-pkg
          path: OpenLibrary-Linux.pkg.tar.zst

  # ===== تغليف حزم Void Linux =====
  build-void:
    name: Build Void Linux Packages (.xbps — glibc + musl)
    needs: [build-linux-elf, build-alpine-elf]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Packaging Dependencies
        run: |
          xbps-install -Suy xbps
          xbps-install -Suy
          xbps-install -y base-devel

      - name: Download glibc Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Linux-PkgBuild
          path: build-src-glibc

      - name: Download musl Build Outputs
        uses: actions/download-artifact@v4
        with:
          name: OpenLibrary-Linux-musl-PkgBuild
          path: build-src-musl

      - name: Prepare Package Root (glibc)
        run: |
          PKG_ROOT="void-pkg-root"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/lib/openlibrary"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          cp build-src-glibc/openlibrary "${PKG_ROOT}/usr/bin/openlibrary"
          chmod +x "${PKG_ROOT}/usr/bin/openlibrary"
          find build-src-glibc/ -name "*.so*" -exec cp -a {} "${PKG_ROOT}/usr/lib/openlibrary/" \; || true
          cp openlibrary.desktop "${PKG_ROOT}/usr/share/applications/"

      - name: Build glibc .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64 \
            -n openlibrary-1.25_1 \
            -s "Open source epub reader" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/openlibrary" \
            --maintainer "ahmed-x86" \
            void-pkg-root

          mv openlibrary-1.25_1.x86_64.xbps OpenLibrary-Void-glibc.xbps

      - name: Upload Void glibc Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Void-glibc-xbps
          path: OpenLibrary-Void-glibc.xbps

      - name: Prepare Package Root (musl)
        run: |
          PKG_ROOT="void-pkg-root-musl"
          mkdir -p "${PKG_ROOT}/usr/bin"
          mkdir -p "${PKG_ROOT}/usr/lib/openlibrary"
          mkdir -p "${PKG_ROOT}/usr/share/applications"
          cp build-src-musl/openlibrary "${PKG_ROOT}/usr/bin/openlibrary"
          chmod +x "${PKG_ROOT}/usr/bin/openlibrary"
          find build-src-musl/ -name "*.so*" -exec cp -a {} "${PKG_ROOT}/usr/lib/openlibrary/" \; || true
          cp openlibrary.desktop "${PKG_ROOT}/usr/share/applications/"

      - name: Build musl .xbps Package with xbps-create
        run: |
          xbps-create \
            -A x86_64-musl \
            -n openlibrary-1.25_1 \
            -s "Open source epub reader" \
            --license GPL \
            --homepage "https://github.com/ahmed-x86/openlibrary" \
            --maintainer "ahmed-x86" \
            void-pkg-root-musl

          mv openlibrary-1.25_1.x86_64-musl.xbps OpenLibrary-Void-musl.xbps

      - name: Upload Void musl Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Void-musl-xbps
          path: OpenLibrary-Void-musl.xbps

  # ===== AppImage + أرشيف tar.gz فيه كل المكتبات (glibc، Qt الرسمي) =====
  build-appimage:
    name: Build AppImage + Bundled tar.gz
    runs-on: ubuntu-22.04   # glibc أقدم = توافق أوسع
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config imagemagick \
            libfontconfig1-dev libgl1-mesa-dev libglu1-mesa-dev libzip-dev libpugixml-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 \
            libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-shm0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Build & install into AppDir
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build
          # ملف desktop صالح للـ AppImage
          D=AppDir/usr/share/applications/openlibrary.desktop
          sed -i 's|^Exec=.*|Exec=openlibrary %F|; s|^Icon=.*|Icon=openlibrary|' "$D"
          grep -q '^Icon=' "$D" || echo 'Icon=openlibrary' >> "$D"
          # أيقونة (أو بديلة لو غير موجودة)
          if [ -f assets/icon.png ]; then cp assets/icon.png openlibrary.png
          else convert -size 256x256 xc:'#3b82f6' openlibrary.png; fi

      - name: Download linuxdeploy
        run: |
          mkdir -p tools && cd tools
          for u in \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage; do
            curl -fsSLO "$u"
          done
          chmod +x *.AppImage

      - name: Bundle libraries & create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QML_SOURCES_PATHS: ${{ github.workspace }}/ui
          LD_LIBRARY_PATH: ${{ env.QT_ROOT_DIR }}/lib
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export PATH="$PWD/tools:$PATH"
          ./tools/linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/openlibrary.desktop \
            --icon-file openlibrary.png --output appimage
          APPIMG="$(ls -1 ./*.AppImage | head -n 1)"
          [ "$APPIMG" = "./OpenLibrary-x86_64.AppImage" ] || mv "$APPIMG" OpenLibrary-x86_64.AppImage
          ls -la OpenLibrary-x86_64.AppImage

      - name: Create tar.gz with all libraries
        run: |
          mkdir -p bundle/OpenLibrary
          cp -a AppDir/usr bundle/OpenLibrary/
          cat > bundle/OpenLibrary/openlibrary <<'EOS'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$HERE/usr/bin/openlibrary" "$@"
          EOS
          chmod +x bundle/OpenLibrary/openlibrary
          tar czf OpenLibrary-Linux-Portable.tar.gz -C bundle OpenLibrary

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-AppImage
          path: OpenLibrary-x86_64.AppImage

      - name: Upload Portable tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-Portable
          path: OpenLibrary-Linux-Portable.tar.gz

  # ===== ELF ستاتيك بالكامل (Qt + كل المكتبات داخل الملف، musl) - تجريبي =====
  # continue-on-error: لو فشل لا يمنع بقية الإصدار. أول بناء طويل (يبني Qt من المصدر)
  # ثم يُخزَّن في الكاش فتصبح التالية سريعة.
  build-static-elf:
    name: Build Static ELF (fully static)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    container:
      image: alpine:latest
    env:
      QT_VER: 6.7.3
      QT_PREFIX: /opt/qt-static
    steps:
      - name: Install Build Dependencies
        run: |
          apk update
          apk add --no-cache build-base cmake ninja perl python3 git linux-headers pkgconf bash curl xz tar zstd upx
          for p in libxcb-dev libxcb-static xcb-util-dev xcb-util-static xcb-util-image-dev xcb-util-image-static \
                   xcb-util-keysyms-dev xcb-util-keysyms-static xcb-util-renderutil-dev xcb-util-renderutil-static \
                   xcb-util-wm-dev xcb-util-wm-static xcb-util-cursor-dev xcb-util-cursor-static \
                   libxkbcommon-dev libxkbcommon-static libxau-dev libxau-static libxdmcp-dev libxdmcp-static \
                   libx11-dev libx11-static; do
            apk add --no-cache "$p" || echo "::warning::package not available: $p"
          done

      - name: Checkout Code
        uses: actions/checkout@v4

      # Qt الستاتيك يُبنى مرة واحدة فقط عبر workflow باسم "Build static Qt (one-time)"
      # وينشر نفسه في Release باسم qt-static-<version>؛ هنا نحمّله فقط (دقيقة بدل ساعة).
      - name: Download prebuilt static Qt
        run: |
          set -eu
          URL="https://github.com/${{ github.repository }}/releases/download/qt-static-${QT_VER}/qt-static-${QT_VER}-alpine-x86_64.tar.zst"
          if ! curl -fSL --retry 3 "$URL" -o /tmp/qt-static.tar.zst; then
            echo "::error::Qt الستاتيك الجاهز غير موجود. شغّل مرة واحدة workflow باسم 'Build static Qt (one-time)' من تبويب Actions ثم أعد المحاولة."
            exit 1
          fi
          tar -I zstd -xf /tmp/qt-static.tar.zst -C /opt
          ls /opt/qt-static/bin | head

      - name: Build static OpenLibrary
        run: |
          set -eux
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DOPENLIBRARY_STATIC_BUILD=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static"
          cmake --build build
          ldd build/openlibrary || true
          cp build/openlibrary openlibrary-elf-static
          strip openlibrary-elf-static || true
          upx --best --lzma openlibrary-elf-static || true
          ls -la openlibrary-elf-static

      - name: Upload Static ELF
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Linux-Static-ELF
          path: openlibrary-elf-static

  # ===== أندرويد (Qt6 + CMake + androiddeployqt) - 3 معماريات + Universal =====
  build-android:
    name: Build Android APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: arm64-v8a,   abi: arm64-v8a,   qt_arch: android_arm64_v8a, all_abis: 'OFF', out: OpenLibrary-Android-arm64-v8a.apk }
          - { name: armeabi-v7a, abi: armeabi-v7a, qt_arch: android_armv7,     all_abis: 'OFF', out: OpenLibrary-Android-armeabi-v7a.apk }
          - { name: x86_64,      abi: x86_64,      qt_arch: android_x86_64,    all_abis: 'OFF', out: OpenLibrary-Android-x86_64.apk }
          - { name: universal,   abi: arm64-v8a,   qt_arch: android_arm64_v8a, all_abis: 'ON',  out: OpenLibrary-Android.apk }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Android project layout (fail fast)
        run: |
          fail() { echo "::error::$1"; exit 1; }
          for f in android/build.gradle android/settings.gradle android/app; do
            [ ! -e "$f" ] || fail "ملف Gradle قديم ما زال موجوداً: $f. احذفه، فـ Qt يولّد مشروع Gradle بنفسه."
          done
          J=android/src/com/ahmed_x86/openlibrary/MainActivity.java
          [ -f android/AndroidManifest.xml ] || fail "android/AndroidManifest.xml غير موجود"
          [ -f "$J" ]                        || fail "$J غير موجود"
          grep -q 'INSERT_APP_LIB_NAME' android/AndroidManifest.xml || fail "الـ manifest ليس بنسخة Qt (ينقصه INSERT_APP_LIB_NAME)"
          grep -q 'extends QtActivity' "$J" || fail "MainActivity يجب أن يرث QtActivity"
          echo "Android layout OK"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      # Qt 6.7 يتطلب رسمياً: platforms;android-34 و build-tools;34.0.0 (JDK 17، NDK r26).
      # أجهزة GitHub مثبّت عليها android-36-ext19، و androiddeployqt يختار "أعلى منصة"،
      # فيفشل aapt2 الخاص بـ AGP في قراءة android.jar الخاص بها. لذلك نستخدم مجلد SDK
      # مستقلاً يحوي بالضبط ما يطلبه Qt 6.7 ولا نعدّل SDK الجهاز.
      - name: Install Android SDK required by Qt 6.7 (isolated)
        run: |
          set -eux
          RUNNER_SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$RUNNER_SDK/cmdline-tools/latest/bin/sdkmanager"
          QT_SDK="$HOME/android-sdk-qt67"
          mkdir -p "$QT_SDK"
          yes | "$SDKM" --sdk_root="$QT_SDK" --licenses > /dev/null
          "$SDKM" --sdk_root="$QT_SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -d "$QT_SDK/platforms/android-34"
          test -d "$QT_SDK/build-tools/34.0.0"
          echo "SDK platforms visible to Qt:"; ls "$QT_SDK/platforms"
          [ "$(ls "$QT_SDK/platforms" | wc -l)" -eq 1 ]
          echo "ANDROID_SDK_ROOT=$QT_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$QT_SDK" >> "$GITHUB_ENV"

      - name: Install Qt6 Host (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Install Qt6 Android (${{ matrix.qt_arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: ${{ matrix.qt_arch }}
          cache: true
          install-deps: false   # الاعتماديات ثُبّتت مع نسخة المضيف؛ يمنع تكرار apt-get

      # للنسخة العامة فقط: نثبّت بقية المعماريات
      - name: Install Qt6 Android (android_armv7) [universal]
        if: matrix.all_abis == 'ON'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_armv7'
          cache: true
          install-deps: false   # الاعتماديات ثُبّتت مع نسخة المضيف؛ يمنع تكرار apt-get

      - name: Install Qt6 Android (android_x86_64) [universal]
        if: matrix.all_abis == 'ON'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_x86_64'
          cache: true
          install-deps: false   # الاعتماديات ثُبّتت مع نسخة المضيف؛ يمنع تكرار apt-get

      - name: Configure & Build APK (CMake + androiddeployqt)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eux
          # install-qt-action يصدّر QT_HOST_PATH تلقائياً (.../Qt/6.7.3/gcc_64)
          QT_BASE="$(dirname "$QT_HOST_PATH")"
          QT_KIT="$QT_BASE/${{ matrix.qt_arch }}"
          test -f "$QT_KIT/lib/cmake/Qt6/qt.toolchain.cmake"

          EXTRA=()
          if [ "${{ matrix.all_abis }}" = "ON" ]; then
            EXTRA+=(
              -DQT_ANDROID_BUILD_ALL_ABIS=ON
              -DQT_PATH_ANDROID_ABI_arm64-v8a="$QT_BASE/android_arm64_v8a"
              -DQT_PATH_ANDROID_ABI_armeabi-v7a="$QT_BASE/android_armv7"
              -DQT_PATH_ANDROID_ABI_x86_64="$QT_BASE/android_x86_64"
            )
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_KIT/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}" \
            "${EXTRA[@]}"

          cmake --build build --target apk

      - name: Align & Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eux
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -n 1)"
          KS="$RUNNER_TEMP/release.keystore"

          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::السر المطلوب للتوقيع غير موجود: $v (Settings > Secrets). لن يُنتَج APK بمفتاح مؤقت."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          export KEYSTORE_PASSWORD KEY_PASSWORD

          mapfile -t APKS < <(find build/android-build -type f -path '*outputs/apk/release/*.apk')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::المتوقع APK واحد في outputs/apk/release لكن وُجد ${#APKS[@]}. كل ملفات APK:"
            find build -type f -name '*.apk'
            exit 1
          fi
          APK_IN="${APKS[0]}"
          echo "Found: $APK_IN"

          "$BT/zipalign" -f -p 4 "$APK_IN" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "${{ matrix.out }}" aligned.apk
          "$BT/apksigner" verify --verbose "${{ matrix.out }}" > verify.txt
          head -n 5 verify.txt

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Android-${{ matrix.name }}
          path: ${{ matrix.out }}

  # ===== ويندوز =====
  build-windows:
    name: Build on windows-latest
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install UPX (Windows)
        run: choco install upx

      - name: Install Qt6 (Windows)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: 'win64_msvc2019_64'
          cache: true

      - name: Build Project
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build build --config Release

      - name: Package Windows with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path OpenLibrary-Windows
          Copy-Item build\Release\openlibrary.exe -Destination OpenLibrary-Windows\
          & "${{ env.QT_ROOT_DIR }}\bin\windeployqt.exe" --release --no-translations --qmldir ui OpenLibrary-Windows\openlibrary.exe
          upx --best --lzma OpenLibrary-Windows\openlibrary.exe
          Compress-Archive -Path OpenLibrary-Windows\* -DestinationPath OpenLibrary-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenLibrary-Windows
          path: OpenLibrary-Windows.zip

  # ===== الإصدار النهائي =====
  release:
    name: Create GitHub Release
    needs: [build-linux-packages, build-linux-packages-musl, build-windows, build-arch-elf, build-arch, build-appimage, build-static-elf, build-void, build-alpine-apk, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Download Table
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cell() {
            local file="$1"
            local path="artifacts/${file}"
            if [ -f "$path" ]; then
              local size
              size=$(du -h "$path" | cut -f1 | sed 's/[[:space:]]*//g')
              echo "[${size}](${BASE_URL}/${file})"
            else
              echo "-----"
            fi
          }

          {
            echo "## 📦 OpenLibrary ${TAG}"
            echo ""
            echo "اختر النسخة المناسبة لجهازك من الجدول تحت وحمّلها مباشرة (الحجم نفسه هو رابط التحميل) 👇"
            echo ""

            echo "### 🐧 لينكس (x86_64)"
            echo ""
            echo "| المكتبة \\ الصيغة | ELF | .tar.gz | .deb | .rpm | .pkg.tar.zst | .xbps | .apk |"
            echo "|:---|:---:|:---:|:---:|:---:|:---:|:---:|:---:|"
            echo "| **glibc** | $(cell openlibrary-elf-glibc) |$(cell OpenLibrary-Linux-Portable.tar.gz) | $(cell OpenLibrary-Linux.deb) |$(cell OpenLibrary-Linux.rpm) | $(cell OpenLibrary-Linux.pkg.tar.zst) |$(cell OpenLibrary-Void-glibc.xbps) | ----- |"
            echo "| **musl**  | $(cell openlibrary-elf-musllibc) | $(cell OpenLibrary-Linux-musl-Portable.tar.gz) |$(cell OpenLibrary-Linux-musl.deb) | $(cell OpenLibrary-Linux-musl.rpm) |----- | $(cell OpenLibrary-Void-musl.xbps) |$(cell OpenLibrary-Alpine.apk) |"
            echo ""

            echo "### 📦 نسخ لينكس متكاملة (بدون الحاجة لأي مكتبات)"
            echo ""
            echo "| AppImage | tar.gz (فيه كل المكتبات) | ELF ستاتيك | Arch ELF (بدون تغليف) | Arch .pkg.tar.zst |"
            echo "|:---:|:---:|:---:|:---:|:---:|"
            echo "| $(cell OpenLibrary-x86_64.AppImage) | $(cell OpenLibrary-Linux-Portable.tar.gz) | $(cell openlibrary-elf-static) | $(cell openlibrary-elf-arch) | $(cell OpenLibrary-Linux.pkg.tar.zst) |"
            echo ""

            echo "### 🤖 أندرويد"
            echo ""
            echo "| التحميل \\ المعمارية | x86_64 | armv7 | armv8 | 🌐 عام (Universal) |"
            echo "|:---|:---:|:---:|:---:|:---:|"
            echo "| **APK** | $(cell OpenLibrary-Android-x86_64.apk) |$(cell OpenLibrary-Android-armeabi-v7a.apk) | $(cell OpenLibrary-Android-arm64-v8a.apk) |$(cell OpenLibrary-Android.apk) |"
            echo ""

            echo "### 🪟 ويندوز"
            echo ""
            echo "| الصيغة \\ المعمارية | x86_64 |"
            echo "|:---|:---:|"
            echo "| **أرشيف (exe)** | $(cell OpenLibrary-Windows.zip) |"
            echo ""
            echo "---"
            echo ""
            echo "> 🐧 **إيه هو ملف الـ ELF؟** ده صيغة البرامج التنفيذية الأساسية في لينكس (زي .exe في ويندوز). حمّله، وعشان تشغّله: دوس عليه Right Click ثم Properties/خصائص وفعّل خيار \"اجعله قابل للتنفيذ / Executable\"، أو من التيرمنال اكتب:"
            echo ">"
            echo "> \`chmod +x /path/to/file\`"
            echo ">"
            echo "> 📦 **glibc ولا musl؟** لو مش عارف، غالبًا توزيعتك بتستخدم **glibc** (زي Ubuntu، Debian، Fedora، Arch، Void...) وده الاختيار الآمن لمعظم الناس. أما **musl** فبتستخدمها توزيعات زي Alpine، ومستخدميها عادةً عارفين إنهم بيستخدموها."
            echo ">"
            echo "> 📁 **إيه هو ملف الـ .tar.gz؟** ده أرشيف محمول فيه البرنامج ومكتباته جاهزين. فكّه واشتغل مباشرة بـ \`./openlibrary\` — مش محتاج تثبيت ولا صلاحيات root."
            echo ">"
            echo "> 💡 **مش عارف تختار (أندرويد)؟** جرّب نسخة **arm64-v8a** لو موبايلك حديث (2018 فما فوق)، أو حمّل النسخة **العامة (Universal)** لو مش عارف معماريتك وعايز خيار آمن يشتغل على أي جهاز."
            echo ""
            echo "---"
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/openlibrary-elf-glibc
            artifacts/openlibrary-elf-musllibc
            artifacts/openlibrary-elf-arch
            artifacts/openlibrary-elf-static
            artifacts/OpenLibrary-x86_64.AppImage
            artifacts/OpenLibrary-Linux-Portable.tar.gz
            artifacts/OpenLibrary-Linux-musl-Portable.tar.gz
            artifacts/OpenLibrary-Linux.deb
            artifacts/OpenLibrary-Linux.rpm
            artifacts/OpenLibrary-Linux-musl.deb
            artifacts/OpenLibrary-Linux-musl.rpm
            artifacts/OpenLibrary-Linux.pkg.tar.zst
            artifacts/OpenLibrary-Void-glibc.xbps
            artifacts/OpenLibrary-Void-musl.xbps
            artifacts/OpenLibrary-Alpine.apk
            artifacts/OpenLibrary-Android-x86_64.apk
            artifacts/OpenLibrary-Android-armeabi-v7a.apk
            artifacts/OpenLibrary-Android-arm64-v8a.apk
            artifacts/OpenLibrary-Android.apk
            artifacts/OpenLibrary-Windows.zip
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}